<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisLog - Predictive Maintenance</title>
    <style>
        /* Military-grade high-contrast dark theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            border-bottom: 2px solid #ff6a00;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            color: #ff6a00;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .status {
            color: #4caf50;
            font-size: 14px;
            background: #1a1a1a;
            padding: 6px 14px;
            border: 1px solid #4caf50;
            border-radius: 4px;
        }
        .section-title {
            color: #ff6a00;
            font-size: 20px;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .alert-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
        }
        .alert-card {
            background: #141414;
            border-left: 6px solid #ff6a00;
            padding: 16px 20px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.05);
            animation: slideIn 0.3s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alert-card.critical {
            border-left-color: #ff1744;
            background: #1a0808;
        }
        .alert-card.failed {
            border-left-color: #ff1744;
            background: #1a0000;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.15);
        }
        .alert-card .message {
            font-size: 18px;
            font-weight: bold;
        }
        .alert-card .meta {
            font-size: 14px;
            color: #888;
            text-align: right;
        }
        .alert-card .meta .health {
            color: #ff6a00;
            font-weight: bold;
            font-size: 18px;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .empty-state {
            color: #555;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
        .orders-container {
            max-height: 40vh;
            overflow-y: auto;
            margin-top: 10px;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .order-table th {
            text-align: left;
            padding: 10px 8px;
            background-color: #1a1a1a;
            color: #ff6a00;
            border-bottom: 2px solid #ff6a00;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .order-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #222;
        }
        .order-table tr:hover {
            background-color: #141414;
        }
        .btn-receive {
            background-color: #1a4a1a;
            color: #4caf50;
            border: 1px solid #4caf50;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-receive:hover {
            background-color: #4caf50;
            color: #0a0a0a;
        }
        .btn-receive:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #222;
            border-color: #555;
            color: #555;
        }
        .btn-receive.loading {
            background-color: #333;
            border-color: #888;
            color: #888;
            cursor: wait;
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge.approved {
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .status-badge.received {
            color: #888;
            border: 1px solid #888;
        }
        .status-badge.pending {
            color: #ffa500;
            border: 1px solid #ffa500;
        }
        .footer {
            margin-top: 30px;
            border-top: 1px solid #222;
            padding-top: 15px;
            font-size: 12px;
            color: #444;
            text-align: center;
        }
        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: opacity 0.3s ease;
            opacity: 0;
        }
        .toast.success {
            background-color: #1a4a1a;
            border-left: 4px solid #4caf50;
            color: #4caf50;
        }
        .toast.error {
            background-color: #4a1a1a;
            border-left: 4px solid #ff1744;
            color: #ff1744;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ AEGISLOG</h1>
            <div class="status">● LIVE PREDICTIVE MAINTENANCE</div>
        </div>

        <!-- Alerts Section -->
        <div class="section-title">🚨 MAINTENANCE ALERTS</div>
        <div id="alertContainer" class="alert-container">
            <div class="empty-state">⏳ Waiting for equipment alerts...</div>
        </div>

        <!-- Orders Section -->
        <div class="section-title">📦 PURCHASE ORDERS</div>
        <div id="ordersContainer" class="orders-container">
            <div class="empty-state">⏳ Loading orders...</div>
        </div>

        <div class="footer">
            <span>Classified: Military-Grade Logistics | Real-Time Anomaly Detection</span>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast" class="toast"></div>

    <script>
        // ----------------------------
        // API Key Configuration
        // ----------------------------
        const API_KEY = 'default-dev-key';

        const container = document.getElementById('alertContainer');
        const ordersContainer = document.getElementById('ordersContainer');
        const toastEl = document.getElementById('toast');

        // ----------------------------
        // Toast helper
        // ----------------------------
        function showToast(message, type = 'success') {
            toastEl.textContent = message;
            toastEl.className = 'toast ' + type + ' show';
            clearTimeout(toastEl._timeout);
            toastEl._timeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 4000);
        }

        // ----------------------------
        // WebSocket for Alerts
        // ----------------------------
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = function() {
            console.log('WebSocket connected.');
            container.innerHTML = '';
        };

        ws.onmessage = function(event) {
            try {
                const alert = JSON.parse(event.data);
                renderAlert(alert);
                // Refresh orders when an alert arrives (in case a reorder was triggered).
                loadOrders();
            } catch (e) {
                console.error('Failed to parse alert:', e);
            }
        };

        ws.onerror = function(err) {
            console.error('WebSocket error:', err);
            container.innerHTML = `<div style="color:#ff1744; padding:20px; text-align:center;">⚠️ Connection lost to server. Refresh the page.</div>`;
        };

        ws.onclose = function() {
            console.log('WebSocket closed.');
        };

        function renderAlert(alert) {
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const card = document.createElement('div');
            card.className = 'alert-card';

            if (alert.message.includes('FAILED')) {
                card.classList.add('failed');
            } else if (alert.health_score <= 20) {
                card.classList.add('critical');
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.textContent = alert.message;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            metaDiv.innerHTML = `
                <div>${alert.equipment_name}</div>
                <div class="health">Health: ${alert.health_score}</div>
                <div style="font-size:12px;color:#666;">${alert.timestamp}</div>
            `;

            card.appendChild(msgDiv);
            card.appendChild(metaDiv);
            container.prepend(card);

            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        // ----------------------------
        // Orders Functions (with API key)
        // ----------------------------
        function loadOrders() {
            fetch('/api/orders')
                .then(response => response.json())
                .then(orders => {
                    renderOrders(orders);
                })
                .catch(err => {
                    console.error('Failed to load orders:', err);
                    ordersContainer.innerHTML = `<div class="empty-state">❌ Failed to load orders.</div>`;
                });
        }

        function renderOrders(orders) {
            if (!orders || orders.length === 0) {
                ordersContainer.innerHTML = `<div class="empty-state">📭 No purchase orders found.</div>`;
                return;
            }

            let html = `
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Item</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            orders.forEach(order => {
                const isReceived = order.status === 'RECEIVED';
                const isPending = order.status === 'PENDING';
                const isApproved = order.status === 'APPROVED';

                let statusClass = 'pending';
                if (isReceived) statusClass = 'received';
                if (isApproved) statusClass = 'approved';

                // Determine action cell content
                let actionHtml = '';
                if (isApproved) {
                    actionHtml = `<button class="btn-receive" onclick="receiveOrder('${order.id}')">📥 Receive</button>`;
                } else if (isReceived) {
                    actionHtml = `<span style="color:#555;">✅ Done</span>`;
                } else {
                    actionHtml = `<span style="color:#888;">⏳ Processing</span>`;
                }

                html += `
                    <tr>
                        <td style="font-size:12px;color:#888;">${order.id}</td>
                        <td>${order.item_name}</td>
                        <td>${order.quantity}</td>
                        <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                        <td>${actionHtml}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            ordersContainer.innerHTML = html;
        }

        function receiveOrder(orderId) {
            // Find the button and disable it, show loading state
            const buttons = document.querySelectorAll('.btn-receive');
            buttons.forEach(btn => btn.disabled = true);
            // Find the specific button for this order and add loading class
            const targetBtn = Array.from(buttons).find(btn => btn.textContent.includes('Receive') && btn.onclick.toString().includes(orderId));
            if (targetBtn) {
                targetBtn.classList.add('loading');
                targetBtn.textContent = '⏳ Processing...';
            }

            fetch(`/api/orders/${orderId}/receive`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': API_KEY
                }
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text || 'Server error'); });
                }
                return response.json();
            })
            .then(data => {
                console.log('Order received:', data);
                showToast('✅ Order received successfully! Stock updated.', 'success');
                loadOrders(); // Refresh the orders table
            })
            .catch(err => {
                console.error('Failed to receive order:', err);
                showToast('❌ Failed to receive order: ' + err.message, 'error');
                // Re-enable buttons on error
                const btns = document.querySelectorAll('.btn-receive');
                btns.forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    if (btn.textContent.includes('Processing')) {
                        btn.textContent = '📥 Receive';
                    }
                });
            });
        }

        // ----------------------------
        // Initial Load
        // ----------------------------
        loadOrders();
        // Refresh orders every 30 seconds
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
