<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisLog - Predictive Maintenance</title>
    <style>
        /* Military-grade high-contrast dark theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            border-bottom: 2px solid #ff6a00;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            color: #ff6a00;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .status {
            color: #4caf50;
            font-size: 14px;
            background: #1a1a1a;
            padding: 6px 14px;
            border: 1px solid #4caf50;
            border-radius: 4px;
        }
        .section-title {
            color: #ff6a00;
            font-size: 20px;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .alert-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
        }
        .alert-card {
            background: #141414;
            border-left: 6px solid #ff6a00;
            padding: 16px 20px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.05);
            animation: slideIn 0.3s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alert-card.critical {
            border-left-color: #ff1744;
            background: #1a0808;
        }
        .alert-card.failed {
            border-left-color: #ff1744;
            background: #1a0000;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.15);
        }
        .alert-card .message {
            font-size: 18px;
            font-weight: bold;
        }
        .alert-card .meta {
            font-size: 14px;
            color: #888;
            text-align: right;
        }
        .alert-card .meta .health {
            color: #ff6a00;
            font-weight: bold;
            font-size: 18px;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .empty-state {
            color: #555;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
        /* Scrollbar styling */
        .alert-container::-webkit-scrollbar,
        .orders-container::-webkit-scrollbar {
            width: 8px;
        }
        .alert-container::-webkit-scrollbar-track,
        .orders-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .alert-container::-webkit-scrollbar-thumb,
        .orders-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        .alert-container::-webkit-scrollbar-thumb:hover,
        .orders-container::-webkit-scrollbar-thumb:hover {
            background: #ff6a00;
        }
        .footer {
            margin-top: 30px;
            border-top: 1px solid #222;
            padding-top: 15px;
            font-size: 12px;
            color: #444;
            text-align: center;
        }

        /* --- NEW: Orders Table Styles --- */
        .orders-container {
            max-height: 40vh;
            overflow-y: auto;
            margin-top: 10px;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .order-table th {
            text-align: left;
            padding: 10px 8px;
            background-color: #1a1a1a;
            color: #ff6a00;
            border-bottom: 2px solid #ff6a00;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .order-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #222;
        }
        .order-table tr:hover {
            background-color: #141414;
        }
        .btn-receive {
            background-color: #1a4a1a;
            color: #4caf50;
            border: 1px solid #4caf50;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-receive:hover {
            background-color: #4caf50;
            color: #0a0a0a;
        }
        .btn-receive:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #222;
            border-color: #555;
            color: #555;
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge.approved {
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .status-badge.received {
            color: #888;
            border: 1px solid #888;
        }
        .status-badge.pending {
            color: #ffa500;
            border: 1px solid #ffa500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ AEGISLOG</h1>
        <div class="status">● LIVE PREDICTIVE MAINTENANCE</div>
    </div>

    <!-- Alerts Section -->
    <div class="section-title">🚨 MAINTENANCE ALERTS</div>
    <div id="alertContainer" class="alert-container">
        <div class="empty-state">⏳ Waiting for equipment alerts...</div>
    </div>

    <!-- Orders Section (NEW) -->
    <div class="section-title">📦 PURCHASE ORDERS</div>
    <div id="ordersContainer" class="orders-container">
        <div class="empty-state">⏳ Loading orders...</div>
    </div>

    <div class="footer">
        <span>Classified: Military-Grade Logistics | Real-Time Anomaly Detection</span>
    </div>

    <script>
        const container = document.getElementById('alertContainer');
        const ordersContainer = document.getElementById('ordersContainer');

        // ----------------------------
        // WebSocket for Alerts
        // ----------------------------
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = function() {
            console.log('WebSocket connected.');
            container.innerHTML = '';
        };

        ws.onmessage = function(event) {
            try {
                const alert = JSON.parse(event.data);
                renderAlert(alert);
                // When an alert comes in, also refresh orders (in case a reorder was triggered).
                loadOrders();
            } catch (e) {
                console.error('Failed to parse alert:', e);
            }
        };

        ws.onerror = function(err) {
            console.error('WebSocket error:', err);
            container.innerHTML = `<div style="color:#ff1744; padding:20px; text-align:center;">⚠️ Connection lost to server. Refresh the page.</div>`;
        };

        ws.onclose = function() {
            console.log('WebSocket closed.');
        };

        function renderAlert(alert) {
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const card = document.createElement('div');
            card.className = 'alert-card';

            if (alert.message.includes('FAILED')) {
                card.classList.add('failed');
            } else if (alert.health_score <= 20) {
                card.classList.add('critical');
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.textContent = alert.message;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            metaDiv.innerHTML = `
                <div>${alert.equipment_name}</div>
                <div class="health">Health: ${alert.health_score}</div>
                <div style="font-size:12px;color:#666;">${alert.timestamp}</div>
            `;

            card.appendChild(msgDiv);
            card.appendChild(metaDiv);
            container.prepend(card);

            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        // ----------------------------
        // Orders Functions (NEW)
        // ----------------------------
        function loadOrders() {
            fetch('/api/orders')
                .then(response => response.json())
                .then(orders => {
                    renderOrders(orders);
                })
                .catch(err => {
                    console.error('Failed to load orders:', err);
                    ordersContainer.innerHTML = `<div class="empty-state">❌ Failed to load orders.</div>`;
                });
        }

        function renderOrders(orders) {
            if (!orders || orders.length === 0) {
                ordersContainer.innerHTML = `<div class="empty-state">📭 No purchase orders found.</div>`;
                return;
            }

            let html = `
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Item</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            orders.forEach(order => {
                const isReceived = order.status === 'RECEIVED';
                const isPending = order.status === 'PENDING';
                const isApproved = order.status === 'APPROVED';

                let statusClass = 'pending';
                if (isReceived) statusClass = 'received';
                if (isApproved) statusClass = 'approved';

                html += `
                    <tr>
                        <td style="font-size:12px;color:#888;">${order.id}</td>
                        <td>${order.item_name}</td>
                        <td>${order.quantity}</td>
                        <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                        <td>
                            ${isApproved ? `<button class="btn-receive" onclick="receiveOrder('${order.id}')">📥 Receive</button>` : 
                            isReceived ? `<span style="color:#555;">✅ Done</span>` : 
                            `<span style="color:#888;">⏳ Processing</span>`}
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            ordersContainer.innerHTML = html;
        }

        function receiveOrder(orderId) {
            // Disable the button to prevent double-clicks
            const buttons = document.querySelectorAll('.btn-receive');
            buttons.forEach(btn => btn.disabled = true);

            fetch(`/api/orders/${orderId}/receive`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Order received:', data);
                // Reload orders to reflect the change
                loadOrders();
                // Also reload inventory/stock display if we had one
            })
            .catch(err => {
                console.error('Failed to receive order:', err);
                alert('Failed to receive order. Check console for details.');
                // Re-enable buttons if there's an error
                const btns = document.querySelectorAll('.btn-receive');
                btns.forEach(btn => btn.disabled = false);
            });
        }

        // ----------------------------
        // Initial Load
        // ----------------------------
        // Load orders on page load.
        loadOrders();

        // Optional: Refresh orders every 30 seconds to catch new ones without WebSocket triggers.
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
